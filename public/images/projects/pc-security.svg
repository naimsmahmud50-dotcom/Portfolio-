  <rect x="382" y="248" width="36" height="30" rx="6" fill="#3B82F6"/>
  <path d="M388 248 V234 C388 227 393 222 400 222 C407 222 412 227 412 234 V248" fill="none" stroke="#60A5FA" stroke-width="4" stroke-linecap="round"/>
