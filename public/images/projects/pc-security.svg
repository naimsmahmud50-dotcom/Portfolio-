  <line x1="210" y1="180" x2="330" y2="230" stroke="#06B6D4" stroke-width="1.5" opacity="0.4" stroke-dasharray="4,4"/>
  <circle cx="590" cy="180" r="6" fill="#3B82F6"/>
  <line x1="590" y1="180" x2="470" y2="230" stroke="#3B82F6" stroke-width="1.5" opacity="0.4" stroke-dasharray="4,4"/>
  <circle cx="240" cy="340" r="6" fill="#8B5CF6"/>
  <line x1="240" y1="340" x2="350" y2="300" stroke="#8B5CF6" stroke-width="1.5" opacity="0.4" stroke-dasharray="4,4"/>
