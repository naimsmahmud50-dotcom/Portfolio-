<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="aiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080718"/>
      <stop offset="100%" stop-color="#14112E"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="aiGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#aiBg)"/>
  <!-- Orbiting agent rings -->
  <circle cx="400" cy="240" r="160" fill="none" stroke="#332B5E" stroke-width="1.5" stroke-dasharray="5,5"/>
  <circle cx="400" cy="240" r="110" fill="none" stroke="url(#purpleGrad)" stroke-width="2" opacity="0.6"/>
  <!-- Central Brain / Bot Core -->
  <circle cx="400" cy="240" r="60" fill="#1A153A" stroke="url(#purpleGrad)" stroke-width="3" filter="url(#aiGlow)"/>
  <path d="M380 230 C380 220 390 210 400 210 C410 210 420 220 420 230 C425 235 425 245 420 250 L400 265 L380 250 C375 245 375 235 380 230 Z" fill="#8B5CF6"/>
  <circle cx="392" cy="232" r="3" fill="#FFFFFF"/>
  <circle cx="408" cy="232" r="3" fill="#FFFFFF"/>
  <!-- Satellite tools -->
  <circle cx="280" cy="180" r="24" fill="#130F30" stroke="#06B6D4" stroke-width="2"/>
  <text x="280" y="185" text-anchor="middle" fill="#06B6D4" font-family="monospace" font-size="12">API</text>
  <circle cx="520" cy="180" r="24" fill="#130F30" stroke="#3B82F6" stroke-width="2"/>
  <text x="520" y="185" text-anchor="middle" fill="#3B82F6" font-family="monospace" font-size="12">RAG</text>
  <circle cx="400" cy="360" r="24" fill="#130F30" stroke="#10B981" stroke-width="2"/>
  <text x="400" y="365" text-anchor="middle" fill="#10B981" font-family="monospace" font-size="12">EXEC</text>
  <!-- Connector lines -->
  <line x1="300" y1="195" x2="350" y2="220" stroke="#06B6D4" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="500" y1="195" x2="450" y2="220" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="400" y1="336" x2="400" y2="300" stroke="#10B981" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="400" y="440" text-anchor="middle" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="14" letter-spacing="2">AUTONOMOUS PERSONAL AI AGENT</text>
</svg>
