<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="mGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05141A"/>
      <stop offset="100%" stop-color="#0B2533"/>
    </linearGradient>
    <linearGradient id="tealCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="mGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#mGrad)"/>
  <!-- Decorative Dome / Portal geometry -->
  <path d="M400 130 C450 170 480 220 480 280 L480 340 L320 340 L320 280 C320 220 350 170 400 130 Z" fill="#071E2B" stroke="url(#tealCyan)" stroke-width="2.5" filter="url(#mGlow)"/>
  <!-- Book / Amal-nama glyph -->
  <path d="M400 230 C420 215 450 215 460 225 V295 C450 285 420 285 400 300 C380 285 350 285 340 295 V225 C350 215 380 215 400 230 Z" fill="#0C2D3D" stroke="#38BDF8" stroke-width="2"/>
  <line x1="400" y1="230" x2="400" y2="300" stroke="#38BDF8" stroke-width="2"/>
  <!-- Floating Dashboard Cards -->
  <rect x="180" y="210" width="120" height="70" rx="8" fill="#061A26" stroke="#10B981" stroke-width="1.5" opacity="0.8"/>
  <text x="240" y="240" text-anchor="middle" fill="#34D399" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">AMAL-NAMA</text>
  <rect x="200" y="252" width="80" height="6" rx="3" fill="#10B981" opacity="0.4"/>
  <rect x="200" y="264" width="55" height="6" rx="3" fill="#10B981" opacity="0.6"/>

  <rect x="500" y="210" width="120" height="70" rx="8" fill="#061A26" stroke="#06B6D4" stroke-width="1.5" opacity="0.8"/>
  <text x="560" y="240" text-anchor="middle" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">GUARDIAN PORTAL</text>
  <rect x="520" y="252" width="80" height="6" rx="3" fill="#06B6D4" opacity="0.4"/>
  <rect x="520" y="264" width="60" height="6" rx="3" fill="#06B6D4" opacity="0.6"/>
  <!-- Title text -->
  <text x="400" y="420" text-anchor="middle" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="14" letter-spacing="2">BANGLADESH MADRASA MANAGEMENT SYSTEM</text>
</svg>
